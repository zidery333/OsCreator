name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  suite:
    name: ${{ matrix.os }} · python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # The suite copies the folder to a throwaway location and works there, so
      # nothing below touches the checkout.
      - name: the suite
        working-directory: Zenith
        run: python .os/tests/run.py

      # Zenith promises it works with nothing installed. Prove the launcher
      # people actually type runs, and that a cold checkout reports itself
      # healthy — through the launcher, not around it.
      - name: a cold folder is healthy
        working-directory: Zenith
        run: |
          ./os check
          ./os save "the boiler service is due in March"
          ./os find boiler

      # The folder prints box-drawing characters on every screen. A narrow
      # locale used to turn that into a traceback on its own heading.
      - name: and healthy in a terminal that cannot spell
        working-directory: Zenith
        env:
          PYTHONIOENCODING: ascii
        run: ./os check
