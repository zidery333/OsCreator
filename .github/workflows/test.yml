name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  suite:
    name: ${{ matrix.os }} · python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # The suite copies the folder to a throwaway location and works there, so
      # nothing below touches the checkout.
      - name: the suite
        working-directory: Zenith
        run: python .os/tests/run.py

      # Zenith promises it works with nothing installed. Prove the launcher
      # people actually type runs, and that a cold checkout reports itself
      # healthy — through the launcher, not around it.
      - name: a cold folder is healthy
        if: runner.os != 'Windows'
        working-directory: Zenith
        run: |
          ./os check
          ./os save "the boiler service is due in March"
          ./os find boiler

      - name: a cold folder is healthy (windows)
        if: runner.os == 'Windows'
        working-directory: Zenith
        shell: cmd
        run: |
          call os.cmd check || exit /b 1
          call os.cmd save "the boiler service is due in March" || exit /b 1
          call os.cmd find boiler || exit /b 1
